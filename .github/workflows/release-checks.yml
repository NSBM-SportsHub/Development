name: Application checks

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SPORTSHUB_DB_HOST: 127.0.0.1
      SPORTSHUB_DB_PORT: 3306
      SPORTSHUB_DB_NAME: sportshub_ci
      SPORTSHUB_DB_USER: root
      SPORTSHUB_DB_PASSWORD: sportshub-ci-only
      SPORTSHUB_ENV: development
      SPORTSHUB_SESSION_SECURE: '0'
      SPORTSHUB_APP_KEY: synthetic-ci-key-never-used-for-production
      SPORTSHUB_PLAYWRIGHT_PATH: .tools/qa/node_modules/playwright/index.mjs
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sportshub-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: sportshub_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PHP and database clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring mysql-client
      - name: Build and frontend tests
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm test --prefix frontend
      - name: PHP configuration, syntax and real database integration
        run: |
          php backend/tests/configuration.php
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l
          node backend/tests/integration.mjs
          SPORTSHUB_API_PORT=8001 node backend/tests/api-verification.mjs
      - name: Backup and restore rehearsal
        run: node backend/tests/backup-restore.mjs
      - name: Browser acceptance and screenshots
        run: |
          npm install --prefix .tools/qa --no-save --package-lock=false playwright
          .tools/qa/node_modules/.bin/playwright install --with-deps chromium
          node tests/browser-workflows.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            .artifacts/*.png
            .artifacts/browser-evidence.json
            .artifacts/backup-restore-evidence.json
            .artifacts/api-operations-*/*.json
            .artifacts/api-operations-*/*.md
            .artifacts/api-operations-*/*.log
            .artifacts/api-verification/*/results.json
            .artifacts/api-verification/*/results.md
            .artifacts/api-verification/*/php-server.log
          if-no-files-found: ignore
          retention-days: 14
