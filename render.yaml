services:
  - type: web
    name: sportshub-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPORTSHUB_ENV
        value: production
      - key: SPORTSHUB_SESSION_SECURE
        value: "1"
      - key: SPORTSHUB_APP_KEY
        generateValue: true
      - key: SPORTSHUB_DB_HOST
        sync: false
      - key: SPORTSHUB_DB_PORT
        value: "3306"
      - key: SPORTSHUB_DB_NAME
        sync: false
      - key: SPORTSHUB_DB_USER
        sync: false
      - key: SPORTSHUB_DB_PASSWORD
        sync: false
